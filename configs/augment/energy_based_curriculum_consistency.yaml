augment:
  name: "energy_based_curriculum_consistency"
  mix_strategy: ricap
  ricap_mode: curriculum  # random / intra / neighbor
  dual_stream: true 
  prob: 0.5
  weighting_mode: "energy"  # 几何面积# area / fixed / energy
  grid_type: random     # random / uniform
  label_smooth: 0
  use_probmap_cache: true
  resize_cached_probmap_if_needeed: false
  shuffle_patch_positions: true