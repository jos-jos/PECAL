# 消融实验A：4区域全部随机裁剪
# 对照组：energy_based_curriculum_consistency.yaml（原版 dual_stream）
# 唯一变量：patch_mode = 'random_crop_all'
# 实验目的：验证显著图引导裁剪（ExG saliency-guided crop）相对于纯随机裁剪的贡献
augment:
  name: "ablation_random_crop_all"
  mix_strategy: "ricap"
  ricap_mode: "curriculum"
  weighting_mode: energy
  dual_stream: true
  prob: 0.5
  grid_type: random
  patch_mode: "random_crop_all"  # ← 消融变量：4个patch全部随机裁剪
